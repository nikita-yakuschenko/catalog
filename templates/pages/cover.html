{% from 'partials/catalog_chrome.html' import cat_foot with context %}
<section class="page cat-page cat-cover">
  <div class="cat-cover-stack">
    <div class="cat-cover-hero">
      <div class="cat-cover-hero-inner">
        <div class="cat-logo cat-logo--hero" aria-hidden="true">{{ logo_svg }}</div>
        <p class="cat-cover-kicker">Каталог проектов · {{ year }}</p>
        <h1 class="cat-cover-title">{{ catalog.title }}</h1>
        {% if catalog.subtitle %}
        <p class="cat-cover-sub">{{ catalog.subtitle }}</p>
        {% endif %}
        <div class="cat-cover-rule" aria-hidden="true"></div>
      </div>
    </div>
    <div class="cat-cover-foot">
      {{ cat_foot() }}
    </div>
  </div>
</section>
